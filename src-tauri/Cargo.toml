[package]
name = "card-studio"
version = "1.0.0"
description = "Card Studio · 多视角 3D 闪卡工坊"
authors = ["Doro"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "card_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
