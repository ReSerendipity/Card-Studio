name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: 依赖漏洞扫描（cargo audit + cargo deny licenses）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit（依赖漏洞扫描）
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: cargo deny check licenses（许可证门禁，需 deny.toml，见 ITEM 5）
        working-directory: src-tauri
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses
  syntax:
    name: JS 语法完整性（零构建前端）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 仓库是零构建的原生 JS 前端（无 package.json / 无打包步骤），
      # 语法错误只会在浏览器运行时暴露，故在 push/PR 上先做静态检查。
      # vendor/ 下是第三方压缩产物，不纳入。
      - name: node --check on first-party JS
        run: |
          set -e
          files=$(ls src-web/js/*.js src-web/server.js docs/ux/*.js)
          echo "$files" | wc -l
          for f in $files; do
            node --check "$f"
            echo "OK  $f"
          done

      - name: smoke (server up + HTTP 200)
        run: |
          node src-web/server.js & SRV=$!
          sleep 1
          curl -sf http://127.0.0.1:4173/ >/dev/null && echo SMOKE_OK || { kill $SRV; exit 1; }
          kill $SRV
