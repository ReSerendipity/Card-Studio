name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows (nsis / msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Pre-publish gate: compile check on src-tauri (locked to Cargo.lock).
      # If this step fails the job aborts before tauri-action runs, so no
      # Release is created. Extend this step with further checks as coverage
      # grows (tests, lint) once those command surfaces exist in the repo.
      - name: Pre-publish check (cargo build)
        working-directory: src-tauri
        run: cargo build --locked

      - name: Build & publish Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Card Studio ${{ github.ref_name }}"
          releaseBody: |
            ## Card Studio ${{ github.ref_name }}
            - Windows 安装包：`.msi` / `.exe`(nsis)
            - Android 测试包（debug 签名 APK）见同版本 Assets（由 Android job 上传）
          releaseDraft: false
          prerelease: false

      - name: Generate SBOM and attach to release (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          path: src-tauri/Cargo.lock
          artifact-name: Card-Studio-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: true

      - name: SHA256 checksums for installers
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse "src-tauri/target/release/bundle" -Include *.msi,*.exe
          if (-not $files) { Write-Error "no installer found"; exit 1 }
          ($files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }) | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Upload bundle for size-budget gate（配合 ITEM 7）
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: src-tauri/target/release/bundle/**/*
          retention-days: 3

  android:
    name: Android (debug APK)
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Tauri Android init
        working-directory: src-tauri
        run: cargo tauri android init

      - name: Build Android APK (debug)
        working-directory: src-tauri
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: cargo tauri android build --debug --apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false

  size-budget:
    name: 包体积预算门禁（Windows bundle）
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: bundle
      - name: Enforce size budget
        run: |
          total=$(du -sm bundle | cut -f1)
          threshold=200
          echo "bundle total = ${total} MB / budget ${threshold} MB"
          if [ "$total" -gt "$threshold" ]; then
            echo "SIZE_BUDGET_EXCEEDED: ${total}MB > ${threshold}MB"
            exit 1
          fi
          echo SIZE_BUDGET_OK
