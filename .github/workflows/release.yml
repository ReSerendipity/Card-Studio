name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows (nsis / msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Pre-publish gate: compile check on src-tauri (locked to Cargo.lock).
      # If this step fails the job aborts before tauri-action runs, so no
      # Release is created. Extend this step with further checks as coverage
      # grows (tests, lint) once those command surfaces exist in the repo.
      - name: Pre-publish check (cargo build)
        working-directory: src-tauri
        run: cargo build --locked

      - name: Build & publish Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Card Studio ${{ github.ref_name }}"
          releaseBody: |
            ## Card Studio ${{ github.ref_name }}
            - Windows 安装包：`.msi` / `.exe`(nsis)
            - Android 测试包（debug 签名 APK）见同版本 Assets（由 Android job 上传）
          releaseDraft: false
          prerelease: false

  android:
    name: Android (debug APK)
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Tauri Android init
        working-directory: src-tauri
        run: cargo tauri android init

      - name: Build Android APK (debug)
        working-directory: src-tauri
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: cargo tauri android build --debug --apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false
