name: Bug 报告
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供最小可复现信息。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 `node src-web/server.js`
        2. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 浏览器 / OS / Node 版本
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 浏览器 DevTools Console 或 Tauri 应用日志目录中的相关输出
    validations:
      required: false
